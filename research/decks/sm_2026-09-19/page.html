<title>OMEN S Deck</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #f6f4ef; --surface: #ffffff; --line: #e2ded4; --ink: #1b1d22; --muted: #6b6f78;
    --s: #1f8a5b; --a: #c98a1b; --c: #7a808c; --save: #2f6fdc; --chip: #ece8df; --chip-on: #1b1d22; --chip-on-ink: #f6f4ef;
    --btn-ink: #ffffff; --shadow: 0 1px 2px rgba(20,22,26,.06);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --ground: #14161a; --surface: #1e2127; --line: #2c3038; --ink: #e7e6e1; --muted: #9096a0;
    --s: #2fa86f; --a: #d9a13a; --c: #8d93a0; --save: #5b8def; --chip: #262a31; --chip-on: #e7e6e1; --chip-on-ink: #14161a;
    --btn-ink: #0f1114; --shadow: none;
  } }
  :root[data-theme="dark"] {
    --ground: #14161a; --surface: #1e2127; --line: #2c3038; --ink: #e7e6e1; --muted: #9096a0;
    --s: #2fa86f; --a: #d9a13a; --c: #8d93a0; --save: #5b8def; --chip: #262a31; --chip-on: #e7e6e1; --chip-on-ink: #14161a;
    --btn-ink: #0f1114; --shadow: none;
  }
  body { background: var(--ground); color: var(--ink); font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 14px 96px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 4px 2px 14px; }
  h1 { font-family: "IBM Plex Sans Condensed", "IBM Plex Sans", sans-serif; font-weight: 600; font-size: 26px; margin: 0; letter-spacing: .01em; text-wrap: balance; }
  .deckname { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; color: var(--muted); font-size: 13px; }
  .lede { color: var(--muted); font-size: 14px; margin: 0 2px 14px; max-width: 60ch; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); margin-bottom: 18px; overflow: hidden; }
  .card.done { border-color: color-mix(in srgb, var(--s) 45%, var(--line)); }
  .card-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .card-head .id { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 14px; font-weight: 500; }
  .card-head .num { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .chart { display: block; width: 100%; height: auto; background: #0e0f12; cursor: zoom-in; }
  .grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 12px 14px 4px; }
  .g { border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 8px; font-weight: 600; font-size: 18px; padding: 14px 0; cursor: pointer; font-family: inherit; }
  .g:focus-visible { outline: 2px solid var(--save); outline-offset: 2px; }
  .g.on-S { background: var(--s); border-color: var(--s); color: var(--btn-ink); }
  .g.on-A { background: var(--a); border-color: var(--a); color: var(--btn-ink); }
  .g.on-C { background: var(--c); border-color: var(--c); color: var(--btn-ink); }
  .g.on-skip { background: var(--chip-on); border-color: var(--chip-on); color: var(--chip-on-ink); }
  .label { padding: 10px 14px 4px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px; }
  .chip { border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 999px; padding: 7px 11px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 13px; cursor: pointer; }
  .chip.on { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
  .chip:focus-visible { outline: 2px solid var(--save); outline-offset: 2px; }
  textarea { width: 100%; box-sizing: border-box; margin: 8px 0 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--ground); color: var(--ink); font: inherit; font-size: 15px; min-height: 64px; resize: vertical; }
  .comment { padding: 0 14px 12px; }
  .status { display: flex; justify-content: space-between; align-items: center; padding: 0 14px 12px; color: var(--muted); font-size: 13px; }
  .status .saved { color: var(--save); }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
  .bar .prog { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .bar .conn { color: var(--muted); font-size: 12px; }
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center; z-index: 10; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100vw; max-height: 100vh; object-fit: contain; }
  .lightbox .close { position: absolute; top: 12px; right: 14px; color: #fff; background: rgba(255,255,255,.15); border: 0; border-radius: 999px; width: 40px; height: 40px; font-size: 20px; }
  @media (prefers-reduced-motion: no-preference) { .g, .chip { transition: background .12s ease, color .12s ease; } }
</style>

  const TIMES = ["9:31","9:35","9:40","9:45","9:50","9:55","10:00","10:05","10:10","10:15","10:20","10:30","later"];
  const GRADES = ["S","A","C","skip"];
  const state = {};   // id -> {grade,time,comment,updatedAt}
  const LS = "omen-s-deck:" + DECK.name;
  try { Object.assign(state, JSON.parse(localStorage.getItem(LS) || "{}")); } catch (e) {}
  let db = null, timers = {};

  function fmtTime(iso) { try { return new Date(iso).toLocaleTimeString([], {hour: "numeric", minute: "2-digit"}); } catch (e) { return ""; } }
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

  function render() {
    const root = document.getElementById("cards");
    root.innerHTML = DECK.cards.map(c => {
      const m = state[c.id] || {};
      return `<section class="card ${m.grade ? "done" : ""}" data-id="${esc(c.id)}">
        <div class="card-head"><span class="num">${c.n} of ${DECK.cards.length}</span><span class="id">${esc(c.symbol)} · ${esc(c.day)}</span></div>
        <img class="chart" src="${c.src}" alt="${esc(c.symbol)} ${esc(c.day)} 1-minute chart" loading="lazy" data-zoom="${esc(c.id)}">
        <div class="grades">${GRADES.map(g => `<button class="g ${m.grade === g ? "on-" + g : ""}" data-grade="${g}" data-id="${esc(c.id)}">${g === "skip" ? "not S" : g}</button>`).join("")}</div>
        <div class="label">Real trade was at</div>
        <div class="chips">${TIMES.map(t => `<button class="chip ${m.time === t ? "on" : ""}" data-time="${t}" data-id="${esc(c.id)}">${t}</button>`).join("")}</div>
        <div class="comment"><textarea data-id="${esc(c.id)}" placeholder="Why — earlier bar, late fire, level, anything">${esc(m.comment || "")}</textarea></div>
        <div class="status"><span>${m.updatedAt ? "Saved " + fmtTime(m.updatedAt) : "Not saved yet"}</span><span class="saved">${m.grade ? (m.grade === "skip" ? "not S" : m.grade) + (m.time ? " @ " + m.time : "") : ""}</span></div>
      </section>`;
    }).join("");
    const done = DECK.cards.filter(c => state[c.id] && state[c.id].grade).length;
    document.getElementById("prog").textContent = `${done} of ${DECK.cards.length} graded`;
  }

  async function persist(id) {
    const m = state[id]; if (!m) return;
    m.updatedAt = new Date().toISOString();
    try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {}
    render();
    if (db) {
      const c = DECK.cards.find(x => x.id === id) || {};
      try { await db.doc("decks/" + DECK.name + "/marks/" + id).set({ id, symbol: c.symbol, day: c.day, grade: m.grade || null, time: m.time || null, comment: m.comment || "", updatedAt: m.updatedAt, by: "austin" }); }
      catch (e) { document.getElementById("conn").textContent = "saved on this phone only (" + (e && e.code || "db error") + ")"; }
    }
  }

  document.addEventListener("click", ev => {
    const g = ev.target.closest("[data-grade]"); if (g) { const id = g.dataset.id; state[id] = state[id] || {}; state[id].grade = g.dataset.grade; persist(id); return; }
    const t = ev.target.closest("[data-time]"); if (t) { const id = t.dataset.id; state[id] = state[id] || {}; state[id].time = state[id].time === t.dataset.time ? null : t.dataset.time; persist(id); return; }
    const z = ev.target.closest("[data-zoom]"); if (z) { document.getElementById("lbimg").src = z.src; document.getElementById("lb").classList.add("open"); return; }
    if (ev.target.closest("#lbclose") || ev.target.id === "lb") { document.getElementById("lb").classList.remove("open"); }
  });
  document.addEventListener("input", ev => {
    const ta = ev.target.closest("textarea[data-id]"); if (!ta) return;
    const id = ta.dataset.id; state[id] = state[id] || {}; state[id].comment = ta.value;
    clearTimeout(timers[id]); timers[id] = setTimeout(() => { const el = document.querySelector(`textarea[data-id="${id}"]`); const pos = el ? el.selectionStart : null; persist(id); if (pos !== null) { const nel = document.querySelector(`textarea[data-id="${id}"]`); if (nel) { nel.focus(); nel.setSelectionRange(pos, pos); } } }, 900);
  });

  render();
  (async () => {
    try { db = await claude.use("db"); } catch (e) { db = null; }
    const conn = document.getElementById("conn");
    if (!db) { conn.textContent = "saved on this phone only"; return; }
    conn.textContent = "synced to Claude";
    db.collection("decks/" + DECK.name + "/marks").onSnapshot(snap => {
      let changed = false;
      snap.docs.forEach(d => { const b = d.data(); if (!b) return; const cur = state[d.id]; if (!cur || !cur.updatedAt || (b.updatedAt && b.updatedAt > cur.updatedAt)) { state[d.id] = { grade: b.grade, time: b.time, comment: b.comment || "", updatedAt: b.updatedAt }; changed = true; } });
      if (changed) { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} render(); }
    }, err => { conn.textContent = "saved on this phone only (" + err.code + ")"; });
  })();
</script>
