<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>OMEN status</title>
<style>
  :root {
    --bg: #0b0d10; --fg: #e8e8e8; --dim: #9aa0a6; --card: #14171a;
    --good: #3ddc84; --bad: #ff6b6b; --line: #262a2e;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f7f7f8; --fg: #1b1e21; --dim: #5b6167; --card: #ffffff;
            --good: #178a4c; --bad: #c8372f; --line: #e2e4e7; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 17px; margin: 0 0 6px; color: var(--dim); font-weight: 600; }
  .headline { font-size: 20px; font-weight: 700; margin: 0 0 12px; }
  .headline .green { color: var(--good); font-weight: 700; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 12px 14px; margin-bottom: 10px; }
  .label { color: var(--dim); font-size: 11px; text-transform: uppercase;
           letter-spacing: .04em; margin-bottom: 4px; }
  .value { font-size: 15px; word-wrap: break-word; }
  .spark { width: 100%; height: 48px; display: block; }
  .spark-good { stroke: var(--good); }
  .spark-bad { stroke: var(--bad); }
  .yes { color: var(--good); font-weight: 600; }
  .no { color: var(--bad); font-weight: 600; }
  .gen { color: var(--dim); font-size: 12px; margin-top: 14px; text-align: center; }
</style>
</head>
<body>
  <h1>OMEN loop</h1>
  <div class="headline">$/day honest: <b>-52</b> (<span class="green">11/25 green</span>)</div>
  <div class="card"><svg viewBox="0 0 320 48" class="spark" role="img" aria-label="16 cycles, -87 to 29 dollars per day"><polyline points="2.0,2.0 23.1,2.4 44.1,34.6 65.2,35.0 86.3,36.1 107.3,32.7 128.4,13.0 149.5,32.7 170.5,46.0 191.6,33.5 212.7,32.7 233.7,32.7 254.8,21.0 275.9,35.4 296.9,21.0 318.0,32.7" fill="none" class="spark-bad" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg></div>
  <div class="card"><div class="label">Last night</div><div class="value">2026-10-02: queue was empty</div>
    <div class="value">H1 pass (72 -&gt; 72), H2 pass (-90 -&gt; -90)</div></div>
  <div class="card"><div class="label">Queue</div><div class="value">0 left</div></div>
  <div class="card"><div class="label">V5 paper</div><div class="value">2 sessions, 1 fills, first legacy fire Mon 09-21</div></div>
  <div class="card"><div class="label">Bar deck</div><div class="value">3 cards last night (ntfy)</div></div>
  <div class="card"><div class="label">Next</div><div class="value">Mon 20:00 loop, Sun 09:00 weekly</div></div>
  <div class="gen">generated 2026-10-02 20:00:22</div>
</body>
</html>
