name: rule-drift
on:
  schedule: [{cron: "0 13 * * 1"}]
  workflow_dispatch:
jobs:
  watch:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/rule_drift_watcher.py --snapshot rules_snapshot.json
        env: {NTFY_TOPIC: "${{ secrets.NTFY_TOPIC }}"}
      - if: always()
        run: |
          git config user.name rule-drift; git config user.email noreply@github.com
          git add rules_snapshot.json && git commit -m "rules_snapshot: weekly" && git push || true
